name: Create Release, Build and Deploy Image

on:
  push:
    branches:
      - 'main'
      - 'beta'
  pull_request_target:
    branches:
      - 'main'
      - 'beta'
    types: [closed]

permissions:
  actions: write
  contents: write
  issues: write
  id-token: write
  pull-requests: write

jobs:
  build-and-release-image:
    if: github.actor == 'dependabot[bot]' || github.event_name == 'push'
    uses: tkhom3/gha-workflows/.github/workflows/build-and-push-image.yml@8bd6f9abef2d5a7e91aa37f08c46a483f917879f # v1.0.19
    secrets: inherit
